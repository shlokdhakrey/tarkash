name: Deploy to Production

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'

jobs:
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web
      
      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      
      - name: Deploy to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> $GITHUB_OUTPUT
        working-directory: apps/web
      
      - name: Comment PR with deployment URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Frontend deployed to: ${{ steps.deploy.outputs.url }}'
            })

  deploy-backend:
    name: Deploy Backend to DigitalOcean
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Generate Prisma Client
        run: pnpm prisma:generate
      
      - name: Build API
        run: pnpm --filter api build
      
      - name: Build Docker image
        run: |
          docker build -f infra/docker/Dockerfile.api -t innovatex-api:${{ github.sha }} .
      
      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DIGITALOCEAN_TOKEN }}
          password: ${{ secrets.DIGITALOCEAN_TOKEN }}
      
      - name: Push to Container Registry
        run: |
          docker tag innovatex-api:${{ github.sha }} registry.digitalocean.com/innovatex/api:latest
          docker tag innovatex-api:${{ github.sha }} registry.digitalocean.com/innovatex/api:${{ github.sha }}
          docker push registry.digitalocean.com/innovatex/api:latest
          docker push registry.digitalocean.com/innovatex/api:${{ github.sha }}
      
      - name: Deploy to DigitalOcean App Platform
        uses: digitalocean/app_action@v1
        with:
          app_name: innovatex-api
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}
      
      - name: Run database migrations
        run: |
          pnpm --filter api prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      
      - name: Health check
        run: |
          sleep 30
          curl -f ${{ secrets.API_URL }}/api/health || exit 1

  deploy-docker:
    name: Deploy via Docker (Alternative)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      
      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infra/docker/Dockerfile.web
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/innovatex-web:latest
            ${{ secrets.REGISTRY_URL }}/innovatex-web:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.REGISTRY_URL }}/innovatex-web:buildcache
          cache-to: type=registry,ref=${{ secrets.REGISTRY_URL }}/innovatex-web:buildcache,mode=max
      
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infra/docker/Dockerfile.api
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/innovatex-api:latest
            ${{ secrets.REGISTRY_URL }}/innovatex-api:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.REGISTRY_URL }}/innovatex-api:buildcache
          cache-to: type=registry,ref=${{ secrets.REGISTRY_URL }}/innovatex-api:buildcache,mode=max
      
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/innovatex
            docker-compose pull
            docker-compose up -d
            docker system prune -f

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deploy-frontend, deploy-backend]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
          body: |
            ## What's Changed
            
            See [CHANGELOG.md](./CHANGELOG.md) for details.
            
            ## Deployment URLs
            - Frontend: ${{ secrets.NEXT_PUBLIC_APP_URL }}
            - API: ${{ secrets.API_URL }}
